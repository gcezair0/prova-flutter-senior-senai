name: task_radar
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  #Roteamento
  go_router: ^17.1.0

  #Gerenciamento de Estado
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # Conexão
  dio: ^5.9.2
  connectivity_plus: ^7.0.0

  #DI
  get_it: ^9.2.1

  # Serialização
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  #Armazenamento
  flutter_secure_storage: ^9.0.0
  drift: ^2.32.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.12.2
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  drift_dev: ^2.18.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
